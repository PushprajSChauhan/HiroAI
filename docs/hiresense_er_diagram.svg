<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .table { fill: #ffffff; stroke: #2b2b2b; stroke-width:2; }
    .title { font: bold 16px monospace; fill: #1f2937; }
    .field { font: 13px monospace; fill: #111827; }
    .fk { fill: #065f46; }
    .pk { fill: #b91c1c; }
    .arrow { stroke: #0f172a; stroke-width:2; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <!-- USERS -->
  <rect x="40" y="40" width="360" height="180" rx="6" ry="6" class="table" />
  <text x="60" y="68" class="title">users</text>
  <text x="60" y="100" class="field"><tspan class="pk">id</tspan> : INT (PK)</text>
  <text x="60" y="122" class="field">name : VARCHAR(100)</text>
  <text x="60" y="144" class="field">email : VARCHAR(100) (UNIQUE)</text>
  <text x="60" y="166" class="field">password : VARCHAR(255)</text>
  <text x="60" y="188" class="field">role : ENUM('user','employer','admin')</text>
  <text x="60" y="210" class="field">status : ENUM('active','blocked')  created_at : TIMESTAMP</text>

  <!-- JOBS -->
  <rect x="800" y="40" width="360" height="240" rx="6" ry="6" class="table" />
  <text x="820" y="68" class="title">jobs</text>
  <text x="820" y="100" class="field"><tspan class="pk">id</tspan> : INT (PK)</text>
  <text x="820" y="122" class="field">title : VARCHAR(150)</text>
  <text x="820" y="144" class="field">description : TEXT</text>
  <text x="820" y="166" class="field">skills : TEXT</text>
  <text x="820" y="188" class="field">company : VARCHAR(100)</text>
  <text x="820" y="210" class="field">employer_id : INT (FK → users.id)</text>
  <text x="820" y="232" class="field">status : VARCHAR(10)  created_at : TIMESTAMP</text>

  <!-- APPLICATIONS -->
  <rect x="380" y="360" width="440" height="220" rx="6" ry="6" class="table" />
  <text x="400" y="388" class="title">applications</text>
  <text x="400" y="420" class="field"><tspan class="pk">id</tspan> : INT (PK)</text>
  <text x="400" y="442" class="field">user_id : INT (FK → users.id)</text>
  <text x="400" y="464" class="field">job_id : INT (FK → jobs.id)</text>
  <text x="400" y="486" class="field">resume_path : VARCHAR(255)</text>
  <text x="400" y="508" class="field">score : FLOAT  status : ENUM('applied','shortlisted','rejected')</text>
  <text x="400" y="530" class="field">applied_at : TIMESTAMP</text>

  <!-- RESUME_ANALYSIS_LOGS -->
  <rect x="40" y="300" width="360" height="160" rx="6" ry="6" class="table" />
  <text x="60" y="328" class="title">resume_analysis_logs</text>
  <text x="60" y="360" class="field"><tspan class="pk">id</tspan> : INT (PK)</text>
  <text x="60" y="382" class="field">user_id : INT (FK → users.id)</text>
  <text x="60" y="404" class="field">result_json : JSON</text>
  <text x="60" y="426" class="field">created_at : TIMESTAMP</text>

  <!-- Arrows -->
  <!-- users -> jobs -->
  <path d="M400 140 L800 140" class="arrow" />
  <text x="550" y="125" class="field">employer_id</text>

  <!-- users -> applications -->
  <path d="M220 220 L520 420" class="arrow" />
  <text x="330" y="300" class="field">user_id</text>

  <!-- jobs -> applications -->
  <path d="M800 200 L680 420" class="arrow" />
  <text x="740" y="320" class="field">job_id</text>

  <!-- users -> resume_analysis_logs -->
  <path d="M220 220 L220 300" class="arrow" />
  <text x="160" y="260" class="field">user_id</text>

  <!-- Legend -->
  <rect x="800" y="320" width="360" height="120" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="820" y="352" class="title">Legend</text>
  <text x="820" y="380" class="field"><tspan class="pk">PK</tspan> = Primary Key</text>
  <text x="820" y="402" class="field"><tspan class="fk">FK</tspan> = Foreign Key</text>
  <text x="820" y="424" class="field">Lines show relationships (1 → many)</text>

</svg>